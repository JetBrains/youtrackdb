name: LDBC JMH Nightly Benchmark

permissions:
  contents: read
  actions: write

on:
  schedule:
    # Run at 3 AM CET (2 AM UTC), after nightly integration tests
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to benchmark'
        required: false
        default: 'develop'

concurrency:
  group: ldbc-jmh-nightly
  cancel-in-progress: false

env:
  LDBC_SCALE_FACTOR: '1'

jobs:
  benchmark:
    runs-on: [self-hosted, Linux, X64, embedded-jmh-benchmark-baremetal]
    timeout-minutes: 720

    steps:
      - name: Clean workspace
        run: |
          rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.??* || true

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch || 'develop' }}
          fetch-depth: 1

      - name: Get commit info
        id: commit
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch=$(git rev-parse --abbrev-ref HEAD)" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +%s)" >> "$GITHUB_OUTPUT"

      - name: Install CLI tools (mc, jq)
        run: |
          # Install MinIO client (static binary, no Python/pip needed)
          curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o /usr/local/bin/mc \
            || curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o "$HOME/mc"
          chmod +x /usr/local/bin/mc 2>/dev/null || chmod +x "$HOME/mc"
          # Ensure mc is on PATH
          if ! command -v mc &>/dev/null; then
            export PATH="$HOME:$PATH"
            echo "$HOME" >> "$GITHUB_PATH"
          fi

          # Install jq if not present (needed for InfluxDB push)
          if ! command -v jq &>/dev/null; then
            curl -fsSL https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64 \
              -o /usr/local/bin/jq \
              || curl -fsSL https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64 \
                -o "$HOME/jq"
            chmod +x /usr/local/bin/jq 2>/dev/null || chmod +x "$HOME/jq"
            if ! command -v jq &>/dev/null; then
              echo "$HOME" >> "$GITHUB_PATH"
            fi
          fi

      # The runner is reused. Remove only the workflow alias from its persistent configuration.
      - name: Remove stale object storage alias
        run: |
          home=${HOME:-}
          if [ -z "$home" ] || [ ! -d "$home" ]; then
            echo '::warning::The home directory is unavailable. Home configuration cleanup was skipped.'
          elif [ -L "$home/.mc" ]; then
            echo '::warning::The home configuration directory is a symbolic link. Home configuration cleanup was skipped.'
          else
            config="$home/.mc/config.json"
            backup="$home/.mc/config.json.old"
            if [ -d "$home/.mc" ]; then
              if ! find "$home/.mc" -maxdepth 1 -type f \( -name 'config.json.tmp.*' -o -name '$tmpfile.*' \) -delete; then
                echo '::warning::Could not remove temporary home configuration files.'
              fi
            fi
            if [ -L "$config" ]; then
              echo '::warning::The home configuration file is a symbolic link. Alias removal was skipped.'
            elif [ ! -f "$config" ]; then
              echo 'No home object storage configuration exists.'
            elif temp=$(mktemp "$home/.mc/config.json.tmp.XXXXXX"); then
              if [ -z "$temp" ]; then
                echo '::warning::Could not create a temporary home configuration file.'
              elif jq 'del(.aliases.hetzner)' "$config" > "$temp"; then
                if chmod 600 "$temp"; then
                  if mv -f "$temp" "$config"; then
                    echo 'Removed the stale object storage alias.'
                  else
                    if ! rm -f "$temp"; then
                      echo '::warning::Could not remove the temporary home configuration after the move failed.'
                    fi
                    echo '::warning::Could not move the replacement home configuration into place.'
                  fi
                else
                  if ! rm -f "$temp"; then
                    echo '::warning::Could not remove the temporary home configuration after mode setting failed.'
                  fi
                  echo '::warning::Could not set mode 600 on the replacement home configuration.'
                fi
              else
                if ! rm -f "$temp"; then
                  echo '::warning::Could not remove the temporary home configuration after filtering failed.'
                fi
                echo '::warning::Could not filter the home object storage configuration.'
              fi
            else
              echo '::warning::Could not create a temporary home configuration file.'
            fi
            if [ -L "$backup" ]; then
              echo '::warning::The home configuration backup is a symbolic link. Backup removal was skipped.'
            elif [ -f "$backup" ]; then
              if rm -f "$backup"; then
                echo 'Removed the stale object storage configuration backup.'
              else
                echo '::warning::Could not remove the stale object storage configuration backup.'
              fi
            fi
          fi
          exit 0

      # The runner clears this private location before and after each job.
      - name: Create object storage configuration directory
        run: |
          config_dir=$(mktemp -d "$RUNNER_TEMP/mc-config.XXXXXX")
          if [ ! -d "$config_dir" ] || [ -L "$config_dir" ]; then
            echo '::error::The object storage configuration path is not a real directory.'
            exit 1
          fi
          if ! chmod 700 "$config_dir"; then
            rm -rf -- "$config_dir"
            echo '::error::Could not secure the object storage configuration directory.'
            exit 1
          fi
          echo "MC_CONFIG_DIR=$config_dir" >> "$GITHUB_ENV"

      # The runner is reused. Keep credentials in the private temporary directory.
      - name: Configure object storage alias
        run: |
          mc alias set hetzner "${{ secrets.HETZNER_S3_ENDPOINT }}" \
            "${{ secrets.HETZNER_S3_ACCESS_KEY }}" "${{ secrets.HETZNER_S3_SECRET_KEY }}"
          mc ls hetzner/bench-cache/ldbc/ || echo "Warning: could not list S3 bucket"

      - name: Download canonical curated parameters from S3
        run: |
          set -euo pipefail
          echo 'Downloading canonical curated parameters from S3...'
          mc cp hetzner/bench-cache/ldbc/curated-params-v3.json \
            "/tmp/curated-params-${{ github.run_id }}.json"
          mc cp hetzner/bench-cache/ldbc/factor-tables.json \
            "/tmp/factor-tables-${{ github.run_id }}.json"
          echo 'Downloaded curated params and factor tables.'

      - name: Download LDBC CSV dataset from S3
        run: |
          set -euo pipefail
          CSV_DIR="jmh-ldbc/target/ldbc-dataset/sf1"
          CSV_TAR="/tmp/ldbc-csv-${{ github.run_id }}.tar"

          echo 'Downloading SF 1 CSV dataset from S3...'
          mc cp hetzner/bench-cache/ldbc/ldbc-sf1-composite-merged-fk.tar.zst "${CSV_TAR}.zst"
          echo 'Downloaded from S3'

          zstd -d "${CSV_TAR}.zst" -o "$CSV_TAR"
          rm -f "${CSV_TAR}.zst"

          mkdir -p "$CSV_DIR"
          tar xf "$CSV_TAR" --strip-components=1 -C "$CSV_DIR"
          rm -f "$CSV_TAR"

          echo "=== Extracted CSV contents ==="
          ls -la "$CSV_DIR/" | head -20

          if [ ! -d "$CSV_DIR/static" ] || [ ! -d "$CSV_DIR/dynamic" ]; then
            echo "::error::CSV dataset missing 'static' or 'dynamic' directories."
            echo "Contents of $CSV_DIR:"
            find "$CSV_DIR" -maxdepth 2 -type d
            exit 1
          fi
          echo "CSV dataset verified: static/ and dynamic/ present"

      - name: Compile
        run: |
          chmod +x mvnw
          ./mvnw -pl jmh-ldbc -am compile -DskipTests -Dspotless.check.skip=true -q

      - name: Install canonical curated parameters
        run: |
          # Install canonical curated params before the pre-load so
          # ParameterCurator finds them and skips regeneration.
          # Ensures all nightly runs use identical params regardless
          # of database iteration order.
          DB_DIR="jmh-ldbc/target/ldbc-bench-db"
          mkdir -p "$DB_DIR"
          cp "/tmp/factor-tables-${{ github.run_id }}.json" \
             "$DB_DIR/factor-tables.json"
          cp "/tmp/curated-params-${{ github.run_id }}.json" \
             "$DB_DIR/curated-params-v3.json"
          echo "Canonical curated params installed"

      - name: Pre-load LDBC database
        run: |
          set -euo pipefail
          ./mvnw -pl jmh-ldbc -am verify -P bench -DskipTests \
            -Dspotless.check.skip=true -Dcentral.skip=true \
            -Djmh.args="LdbcSingleThreadIC.*ic5_newGroups -f 0 -wi 0 -i 1 -r 1s -t 1" \
            2>&1 | tee /tmp/jmh-load-${{ github.run_id }}.txt

          # Verify the database was actually created
          if [ ! -d "jmh-ldbc/target/ldbc-bench-db/ldbc_benchmark" ]; then
            echo "::error::Database was not created after CSV load. Check load output above."
            exit 1
          fi
          echo "Database loaded successfully from CSV"

      - name: Warm OS page cache
        run: |
          set -euo pipefail
          ./mvnw -pl jmh-ldbc -am verify -P bench -DskipTests \
            -Dspotless.check.skip=true -Dcentral.skip=true \
            -Djmh.args="-f 0 -wi 0 -i 1 -r 5s -t 1" \
            2>&1 | tee /tmp/jmh-warm-${{ github.run_id }}.txt

          # JMH exits 0 even when all benchmarks fail with -f 0.
          # Detect this by checking for failures with no successful results.
          if grep -q '<failure>' /tmp/jmh-warm-${{ github.run_id }}.txt; then
            if ! grep -qE '^[A-Za-z].*\s+avgt\s+' /tmp/jmh-warm-${{ github.run_id }}.txt && \
               ! grep -qE '^[A-Za-z].*\s+thrpt\s+' /tmp/jmh-warm-${{ github.run_id }}.txt && \
               ! grep -qE '^[A-Za-z].*\s+sample\s+' /tmp/jmh-warm-${{ github.run_id }}.txt && \
               ! grep -qE '^[A-Za-z].*\s+ss\s+' /tmp/jmh-warm-${{ github.run_id }}.txt; then
              echo "::error::All warm-up benchmarks failed. Check database setup."
              grep 'IllegalStateException\|Exception\|Error' /tmp/jmh-warm-${{ github.run_id }}.txt | head -5 || true
              exit 1
            fi
          fi

      - name: Run benchmarks
        run: |
          set -euo pipefail
          ./mvnw -pl jmh-ldbc -am verify -P bench -DskipTests \
            -Dspotless.check.skip=true -Dcentral.skip=true \
            -Djmh.args="-rf json -rff /tmp/jmh-results-${{ github.run_id }}.json" \
            2>&1 | tee /tmp/jmh-bench-log-${{ github.run_id }}.txt

      - name: Validate benchmark results
        run: |
          set -euo pipefail
          RESULTS="/tmp/jmh-results-${{ github.run_id }}.json"
          if [ ! -s "$RESULTS" ]; then
            echo "::error::Benchmark produced no results (empty or missing JSON)."
            tail -50 /tmp/jmh-bench-log-${{ github.run_id }}.txt || true
            exit 1
          fi
          COUNT=$(jq 'length' "$RESULTS")
          if [ "$COUNT" -eq 0 ] || [ "$COUNT" = "null" ]; then
            echo "::error::Benchmark JSON contains zero results."
            exit 1
          fi
          echo "Benchmark results contain $COUNT entries"
          # Copy to workspace for artifact upload
          cp "$RESULTS" "${{ github.workspace }}/results.json"

      # Push happens BEFORE the regression check, intentionally. Two reasons:
      #   1. The regressing point itself must be visible on the Grafana
      #      dashboard so a human investigator can compare it to history.
      #   2. The rolling-average check (vs 14-run avg) is the primary signal
      #      for sustained regressions, and it already tolerates one noisy
      #      outlier — so priming the next run's baseline with the bad point
      #      does not mask a real regression, only (at worst) a small
      #      run-over-run rebound on the next night.
      # If this ordering ever needs to be revisited, do it together with the
      # alerter's math, not on its own.
      - name: Push results to InfluxDB
        if: success()
        env:
          INFLUXDB_URL: ${{ secrets.INFLUXDB_URL }}
          INFLUXDB_TOKEN: ${{ secrets.INFLUXDB_TOKEN }}
        run: |
          bash jmh-ldbc/jmh-to-influxdb.sh \
            --input "${{ github.workspace }}/results.json" \
            --influxdb-url "$INFLUXDB_URL" \
            --influxdb-token "$INFLUXDB_TOKEN" \
            --influxdb-org youtrackdb \
            --influxdb-bucket jmh-benchmarks \
            --branch "${{ steps.commit.outputs.branch }}" \
            --commit-sha "${{ steps.commit.outputs.sha }}" \
            --timestamp "${{ steps.commit.outputs.timestamp }}"

      - name: Check for benchmark regressions
        # Intentionally no `|| true` — if the alerter crashes we want the
        # workflow to fail loudly rather than silently drop regression signals.
        if: success()
        env:
          INFLUXDB_URL: ${{ secrets.INFLUXDB_URL }}
          INFLUXDB_TOKEN: ${{ secrets.INFLUXDB_TOKEN }}
          ZULIP_API_KEY: ${{ secrets.ZULIP_API_KEY }}
        run: |
          python3 jmh-ldbc/jmh-regression-alert.py \
            --input "${{ github.workspace }}/results.json" \
            --influxdb-url "$INFLUXDB_URL" \
            --influxdb-token "$INFLUXDB_TOKEN" \
            --influxdb-org youtrackdb \
            --influxdb-bucket jmh-benchmarks \
            --branch "${{ steps.commit.outputs.branch }}" \
            --commit-sha "${{ steps.commit.outputs.sha }}" \
            --zulip-api-key "$ZULIP_API_KEY"

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jmh-results-${{ steps.commit.outputs.short_sha }}-${{ github.run_id }}
          path: |
            ${{ github.workspace }}/results.json
            /tmp/jmh-bench-log-${{ github.run_id }}.txt
            /tmp/jmh-warm-${{ github.run_id }}.txt
            /tmp/jmh-load-${{ github.run_id }}.txt
          retention-days: 90

      # Remove credentials after every job outcome.
      # A machine crash skips this cleanup step. The project accepts this limitation.
      - name: Clean up object storage configuration
        if: always()
        run: |
          home=${HOME:-}
          if [ -z "$home" ] || [ ! -d "$home" ]; then
            echo '::warning::The home directory is unavailable. Home configuration cleanup was skipped.'
          elif [ -L "$home/.mc" ]; then
            echo '::warning::The home configuration directory is a symbolic link. Home configuration cleanup was skipped.'
          elif [ -d "$home/.mc" ]; then
            if ! find "$home/.mc" -maxdepth 1 -type f \( -name 'config.json.tmp.*' -o -name '$tmpfile.*' \) -delete; then
              echo '::warning::Could not remove temporary home configuration files.'
            fi
          fi
          if [ -z "${MC_CONFIG_DIR:-}" ]; then
            echo 'No object storage configuration path was published.'
          elif [ -z "${RUNNER_TEMP:-}" ]; then
            echo '::warning::The runner temporary directory is empty. Cleanup was skipped.'
          elif runner_temp=$(realpath -m -- "$RUNNER_TEMP"); then
            if config_dir=$(realpath -m -- "$MC_CONFIG_DIR"); then
              case "$config_dir" in
                "$runner_temp"/*)
                  if [ -L "$MC_CONFIG_DIR" ]; then
                    echo '::warning::The configuration path became a symbolic link. Cleanup was skipped.'
                  elif [ -e "$MC_CONFIG_DIR" ] && [ ! -d "$MC_CONFIG_DIR" ]; then
                    echo '::warning::The configuration path is not a directory. Cleanup was skipped.'
                  elif rm -rf -- "$MC_CONFIG_DIR"; then
                    echo 'Removed the object storage configuration.'
                  else
                    echo '::warning::Could not fully remove the object storage configuration directory.'
                  fi
                  ;;
                *)
                  echo '::warning::The configuration path is outside the runner temporary directory.'
                  ;;
              esac
            else
              echo '::warning::Could not resolve the object storage configuration path. Cleanup was skipped.'
            fi
          else
            echo '::warning::Could not resolve the runner temporary directory. Cleanup was skipped.'
          fi
          exit 0

      - name: Clean up temp files
        if: always()
        run: |
          rm -f /tmp/curated-params-${{ github.run_id }}.json \
                /tmp/factor-tables-${{ github.run_id }}.json \
                /tmp/ldbc-csv-${{ github.run_id }}.tar \
                /tmp/ldbc-csv-${{ github.run_id }}.tar.zst \
                /tmp/jmh-results-${{ github.run_id }}.json \
                /tmp/jmh-bench-log-${{ github.run_id }}.txt \
                /tmp/jmh-warm-${{ github.run_id }}.txt \
                /tmp/jmh-load-${{ github.run_id }}.txt
