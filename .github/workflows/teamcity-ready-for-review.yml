name: Start TeamCity ready-for-review builds

on:
  pull_request_target:
    types: [ready_for_review]
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: teamcity-ready-for-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  start-ready-summary:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          # pull_request_target sets github.sha to the trusted base commit.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Start TeamCity ready summary
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TEAMCITY_READY_TRIGGER_TOKEN: ${{ secrets.TEAMCITY_READY_TRIGGER_TOKEN }}
        run: python3 .github/scripts/teamcity-ready-for-review.py
