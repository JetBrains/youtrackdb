name: TeamCity connecting script tests

on:
  push:
    branches: [develop, main]
    paths:
      - '.github/scripts/teamcity-build.py'
      - '.github/scripts/teamcity-build-test.py'
      - '.github/scripts/detect-changes.py'
      - '.github/scripts/test-failure-gate.py'
      - '.github/workflows/teamcity-build-tests.yml'
  pull_request:
    paths:
      - '.github/scripts/teamcity-build.py'
      - '.github/scripts/teamcity-build-test.py'
      - '.github/scripts/detect-changes.py'
      - '.github/scripts/test-failure-gate.py'
      - '.github/workflows/teamcity-build-tests.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest-8-cores-x64-public
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run unit tests
        run: python3 .github/scripts/teamcity-build-test.py
