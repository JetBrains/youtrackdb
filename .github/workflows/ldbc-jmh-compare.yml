name: LDBC JMH Benchmark Compare

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: number
      head_repository:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      runner_cores:
        description: Requested dedicated vCPU profile. Allowed values are 8 and 32.
        required: false
        type: string
        default: '8'
    secrets:
      HETZNER_S3_ACCESS_KEY:
        required: true
      HETZNER_S3_SECRET_KEY:
        required: true
      HETZNER_S3_ENDPOINT:
        required: true
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number. Leave empty when using commit_sha.
        required: false
        type: string
        default: ''
      commit_sha:
        description: Full same-repository commit SHA. Leave empty when using pr_number.
        required: false
        type: string
        default: ''
      queries:
        description: Comma-separated IS1-IS7, IC1-IC13, or gremlin. Empty runs all.
        required: false
        type: string
        default: ''
      gremlin_arms:
        description: Production arm or optional investigation A/B arms
        required: false
        type: choice
        options: ['on', 'both']
        default: 'on'
      runner_cores:
        description: Requested dedicated vCPU profile
        required: false
        type: choice
        options: ['8', '32']
        default: '8'

concurrency:
  group: ldbc-jmh-${{ inputs.pr_number != '' && format('pr-{0}', inputs.pr_number) || format('sha-{0}', inputs.commit_sha) }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  LDBC_SCALE_FACTOR: '1'
  FIXED_EXCLUSION: LdbcSingleThreadBothEBenchmark

jobs:
  resolve:
    name: Resolve immutable comparison target
    runs-on: ubuntu-latest-8-cores-x64-public
    outputs:
      target_mode: ${{ steps.identity.outputs.target_mode }}
      target_key: ${{ steps.identity.outputs.target_key }}
      pr_number: ${{ steps.identity.outputs.pr_number }}
      head_repository: ${{ steps.identity.outputs.head_repository }}
      head_sha: ${{ steps.identity.outputs.head_sha }}
      base_sha: ${{ steps.identity.outputs.base_sha }}
      baseline_sha: ${{ steps.identity.outputs.baseline_sha }}
      queries: ${{ steps.identity.outputs.queries }}
      gremlin_arms: ${{ steps.identity.outputs.gremlin_arms }}
      full_pr: ${{ steps.identity.outputs.full_pr }}
      runner_cores: ${{ steps.identity.outputs.runner_cores }}
      runner_label: ${{ steps.identity.outputs.runner_label }}
      runner_memory_gb: ${{ steps.identity.outputs.runner_memory_gb }}
      tooling_sha: ${{ steps.tooling.outputs.sha }}
    steps:
      - name: Reject untrusted manual workflow ref
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/develop'
        run: |
          echo "::error::Manual comparisons must dispatch the workflow from develop."
          exit 1

      - name: Resolve immutable trusted develop tooling
        id: tooling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/develop" --jq '.object.sha')
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted resolver
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.tooling.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve target, baseline, and filter
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PR: ${{ inputs.pr_number }}
          INPUT_SHA: ${{ inputs.commit_sha }}
          CALL_HEAD_REPOSITORY: ${{ inputs.head_repository }}
          CALL_HEAD_SHA: ${{ inputs.head_sha }}
          CALL_BASE_SHA: ${{ inputs.base_sha }}
          QUERIES: ${{ inputs.queries }}
          GREMLIN_ARMS: ${{ inputs.gremlin_arms }}
          RUNNER_CORES: ${{ inputs.runner_cores }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_call" ]]; then
            INPUT_SHA=
          fi
          TARGET=$(python3 .github/scripts/mandatory-benchmark.py target \
            --pr-number "$INPUT_PR" --commit-sha "$INPUT_SHA")
          MODE=$(jq -r .mode <<< "$TARGET")
          VALUE=$(jq -r .value <<< "$TARGET")
          python3 .github/scripts/mandatory-benchmark.py filter --queries "$QUERIES" >/dev/null
          ARMS="${GREMLIN_ARMS:-on}"
          [[ "$ARMS" == "on" || "$ARMS" == "both" ]]
          RUNNER=$(python3 .github/scripts/mandatory-benchmark.py runner-profile \
            --cores "${RUNNER_CORES:-8}")
          RUNNER_CORES=$(jq -r .requested_cores <<< "$RUNNER")
          RUNNER_LABEL=$(jq -r .label <<< "$RUNNER")
          RUNNER_MEMORY_GB=$(jq -r .memory_gb <<< "$RUNNER")

          if [[ "$MODE" == "pr" ]]; then
            PR_JSON=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$VALUE")
            PR_NUMBER=$(jq -r .number <<< "$PR_JSON")
            HEAD_REPOSITORY=$(jq -r .head.repo.full_name <<< "$PR_JSON")
            HEAD_SHA=$(jq -r .head.sha <<< "$PR_JSON")
            BASE_SHA=$(jq -r .base.sha <<< "$PR_JSON")
            if [[ "$EVENT_NAME" == "workflow_call" ]]; then
              [[ "$HEAD_REPOSITORY" == "$CALL_HEAD_REPOSITORY" ]]
              [[ "$HEAD_SHA" == "$CALL_HEAD_SHA" ]]
              [[ "$BASE_SHA" == "$CALL_BASE_SHA" ]]
            fi
            git fetch --no-tags "https://github.com/$HEAD_REPOSITORY.git" "$HEAD_SHA"
            git fetch --no-tags origin "$BASE_SHA"
            BASELINE_SHA=$(git merge-base "$HEAD_SHA" "$BASE_SHA")
            [[ "$BASELINE_SHA" != "$HEAD_SHA" ]]

            if [[ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
              gh api --paginate --slurp \
                "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/reviews" \
                | jq 'flatten' > /tmp/reviews.json
              printf '{}\n' > /tmp/permissions.json
              mapfile -t REVIEWERS < <(jq -r '.[].user.login' /tmp/reviews.json | sort -u)
              for reviewer in "${REVIEWERS[@]}"; do
                PERMISSION=$(gh api \
                  "repos/$GITHUB_REPOSITORY/collaborators/$reviewer/permission" \
                  --jq .permission 2>/dev/null || true)
                jq --arg login "$reviewer" --arg permission "$PERMISSION" \
                  '. + {($login): $permission}' /tmp/permissions.json > /tmp/permissions.next
                mv /tmp/permissions.next /tmp/permissions.json
              done
              python3 .github/scripts/mandatory-benchmark.py approval \
                --reviews /tmp/reviews.json --permissions /tmp/permissions.json \
                --head-sha "$HEAD_SHA"
            fi
            TARGET_KEY="pr-$PR_NUMBER"
          else
            PR_NUMBER=
            HEAD_REPOSITORY="$GITHUB_REPOSITORY"
            HEAD_SHA="$VALUE"
            git fetch origin '+refs/heads/*:refs/remotes/origin/*' \
              '+refs/tags/*:refs/tags/*' --force --tags
            BASELINE_SHA=$(python3 .github/scripts/mandatory-benchmark.py owned-commit \
              --repository . --sha "$HEAD_SHA")
            BASE_SHA="$BASELINE_SHA"
            TARGET_KEY="sha-$HEAD_SHA"
          fi

          FULL_PR=false
          if [[ "$MODE" == "pr" && -z "$QUERIES" && "$ARMS" == "on" ]]; then
            FULL_PR=true
          fi
          {
            echo "target_mode=$MODE"
            echo "target_key=$TARGET_KEY"
            echo "pr_number=$PR_NUMBER"
            echo "head_repository=$HEAD_REPOSITORY"
            echo "head_sha=$HEAD_SHA"
            echo "base_sha=$BASE_SHA"
            echo "baseline_sha=$BASELINE_SHA"
            echo "queries=$QUERIES"
            echo "gremlin_arms=$ARMS"
            echo "full_pr=$FULL_PR"
            echo "runner_cores=$RUNNER_CORES"
            echo "runner_label=$RUNNER_LABEL"
            echo "runner_memory_gb=$RUNNER_MEMORY_GB"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Requested benchmark runner"
            echo
            echo "- Profile: $RUNNER_CORES dedicated vCPUs, $RUNNER_MEMORY_GB GB memory"
            echo "- Resolved provider label: \`$RUNNER_LABEL\`"
            echo
            echo "This records the requested configuration, not physical hardware proof."
          } >> "$GITHUB_STEP_SUMMARY"

  retrieve-dataset:
    name: Retrieve benchmark dataset
    needs: resolve
    runs-on: ubuntu-latest-8-cores-x64-public
    permissions:
      contents: read
    steps:
      - run: python3 -m pip install 'boto3==1.40.46'
      - name: Download canonical inputs without target code
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
          S3_ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
        run: |
          mkdir dataset
          python3 - <<'PY'
          import boto3
          import os
          client = boto3.client(
              "s3", endpoint_url=os.environ["S3_ENDPOINT"],
              aws_access_key_id=os.environ["AWS_ACCESS_KEY_ID"],
              aws_secret_access_key=os.environ["AWS_SECRET_ACCESS_KEY"])
          for source, target in {
              "ldbc/curated-params-v3.json": "dataset/curated-params-v3.json",
              "ldbc/factor-tables.json": "dataset/factor-tables.json",
              "ldbc/ldbc-sf1-composite-merged-fk.tar.zst": "dataset/ldbc.tar.zst",
          }.items():
            client.download_file("bench-cache", source, target)
          PY
          test -s dataset/curated-params-v3.json
          test -s dataset/factor-tables.json
          test -s dataset/ldbc.tar.zst
      - uses: actions/upload-artifact@v7
        with:
          name: ldbc-dataset-attempt${{ github.run_attempt }}
          path: dataset
          retention-days: 1
          if-no-files-found: error

  benchmark:
    name: Execute comparison on requested ${{ needs.resolve.outputs.runner_cores }}-vCPU profile
    needs: [resolve, retrieve-dataset]
    runs-on:
      - self-hosted
      - ${{ needs.resolve.outputs.runner_label }}
      - image-x86-system-ubuntu-24.04
      - in-nbg1-fsn1-hel1
    timeout-minutes: 1800
    permissions:
      contents: read
      actions: read
    steps:
      - name: Install execution tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd > /dev/null 2>&1
      - uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.resolve.outputs.tooling_sha }}
          path: trusted-workflow
          persist-credentials: false
      - name: Select dataset from the latest available attempt
        id: dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            | jq '[.[].artifacts[]]' > /tmp/artifacts.json
          ID=$(python3 trusted-workflow/.github/scripts/mandatory-benchmark.py \
            select-artifact --artifacts /tmp/artifacts.json --prefix ldbc-dataset \
            --max-attempt "$GITHUB_RUN_ATTEMPT")
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          cp trusted-workflow/.github/scripts/mandatory-benchmark.py \
            /tmp/mandatory-benchmark.py
      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.dataset.outputs.id }}
          path: /tmp/ldbc-input
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.resolve.outputs.head_repository }}
          ref: ${{ needs.resolve.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact target checkout
        env:
          EXPECTED_HEAD: ${{ needs.resolve.outputs.head_sha }}
          BASELINE_SHA: ${{ needs.resolve.outputs.baseline_sha }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_HEAD" ]]
          if ! git cat-file -e "$BASELINE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags "https://github.com/$GITHUB_REPOSITORY.git" "$BASELINE_SHA"
          fi
      - name: Run baseline and target benchmarks
        env:
          BASELINE_SHA: ${{ needs.resolve.outputs.baseline_sha }}
          HEAD_SHA: ${{ needs.resolve.outputs.head_sha }}
          QUERIES: ${{ needs.resolve.outputs.queries }}
          GREMLIN_ARMS: ${{ needs.resolve.outputs.gremlin_arms }}
          RUNNER_CORES: ${{ needs.resolve.outputs.runner_cores }}
          RUNNER_LABEL: ${{ needs.resolve.outputs.runner_label }}
          RUNNER_MEMORY_GB: ${{ needs.resolve.outputs.runner_memory_gb }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/mandatory-output
          {
            echo "requested_cores=$RUNNER_CORES"
            echo "resolved_label=$RUNNER_LABEL"
            echo "memory_gb=$RUNNER_MEMORY_GB"
            echo "This is the requested configuration, not physical hardware proof."
          } | tee /tmp/mandatory-output/runner-profile.txt >> "$GITHUB_STEP_SUMMARY"
          zstd -d /tmp/ldbc-input/ldbc.tar.zst -o /tmp/ldbc.tar
          SELECTION=$(python3 /tmp/mandatory-benchmark.py filter \
            --queries "$QUERIES" --format shell)
          PARAM=
          [[ "$GREMLIN_ARMS" == "on" ]] && PARAM='-p translatorEnabled=true'

          run_side() {
            local side=$1
            local sha=$2
            git checkout --detach "$sha"
            chmod +x mvnw
            ./mvnw -pl jmh-ldbc -am clean compile -DskipTests \
              -Dspotless.check.skip=true -q
            local db=jmh-ldbc/target/ldbc-bench-db
            local csv=jmh-ldbc/target/ldbc-dataset/sf1
            mkdir -p "$db" "$csv"
            python3 /tmp/mandatory-benchmark.py install-inputs \
              --source /tmp/ldbc-input --destination "$db"
            tar xf /tmp/ldbc.tar --strip-components=1 -C "$csv"
            ./mvnw -pl jmh-ldbc -am verify -P bench -DskipTests \
              -Dspotless.check.skip=true -Dcentral.skip=true \
              -Djmh.args="${SELECTION} -e $FIXED_EXCLUSION ${PARAM} -f 0 -wi 0 -i 1 -r 1s" >/tmp/mandatory-output/$side-warm.log
            ./mvnw -pl jmh-ldbc -am verify -P bench -DskipTests \
              -Dspotless.check.skip=true -Dcentral.skip=true \
              -Djmh.args="${SELECTION} -e $FIXED_EXCLUSION ${PARAM} -l" \
              | grep '^com\.jetbrains\..*Benchmark\.' | sort -u \
              > "/tmp/mandatory-output/$side-inventory.txt"
            python3 - "/tmp/mandatory-output/$side-inventory.txt" \
              "/tmp/mandatory-output/$side-inventory.json" <<'PY'
          import json
          import pathlib
          import sys
          names = pathlib.Path(sys.argv[1]).read_text().splitlines()
          pathlib.Path(sys.argv[2]).write_text(json.dumps(names))
          PY
            ./mvnw -pl jmh-ldbc -am verify -P bench -DskipTests \
              -Dspotless.check.skip=true -Dcentral.skip=true \
              -Djmh.args="${SELECTION} -e $FIXED_EXCLUSION ${PARAM} -rf json -rff /tmp/mandatory-output/$side-results.json" \
              2>&1 | tee "/tmp/mandatory-output/$side.log"
            test -s "/tmp/mandatory-output/$side-results.json"
          }
          run_side base "$BASELINE_SHA"
          run_side head "$HEAD_SHA"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mandatory-execution-attempt${{ github.run_attempt }}
          path: /tmp/mandatory-output
          retention-days: 90
          if-no-files-found: warn

  validate:
    name: Validate and publish comparison completion
    needs: [resolve, benchmark]
    if: needs.benchmark.result == 'success'
    runs-on: ubuntu-latest-8-cores-x64-public
    permissions:
      contents: read
      actions: read
      pull-requests: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Resolve signer workflow identity
        id: signer
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const token = await core.getIDToken('sigstore');
            const claims = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString('utf8'));
            const expected = `${context.repo.owner}/${context.repo.repo}/` +
              `.github/workflows/ldbc-jmh-compare.yml@refs/heads/develop`;
            if (claims.job_workflow_ref !== expected ||
                !/^[0-9a-f]{40}$/.test(claims.job_workflow_sha)) {
              core.setFailed('Unexpected signer workflow identity.');
              return;
            }
            core.setOutput('sha', claims.job_workflow_sha);
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.signer.outputs.sha }}
          path: trusted-workflow
          persist-credentials: false
      - name: Select execution output from the latest available attempt
        id: execution
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            | jq '[.[].artifacts[]]' > /tmp/artifacts.json
          ID=$(python3 trusted-workflow/.github/scripts/mandatory-benchmark.py \
            select-artifact --artifacts /tmp/artifacts.json \
            --prefix mandatory-execution --max-attempt "$GITHUB_RUN_ATTEMPT")
          echo "id=$ID" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          artifact-ids: ${{ steps.execution.outputs.id }}
          path: /tmp/execution
      - name: Validate independent result inventories
        run: |
          python3 trusted-workflow/.github/scripts/mandatory-benchmark.py validate \
            --base-results /tmp/execution/base-results.json \
            --head-results /tmp/execution/head-results.json \
            --base-inventory /tmp/execution/base-inventory.json \
            --head-inventory /tmp/execution/head-inventory.json \
            --gremlin-arms '${{ needs.resolve.outputs.gremlin_arms }}' \
            --output /tmp/validation.json
      - name: Generate informational comparison
        env:
          RUNNER_CORES: ${{ needs.resolve.outputs.runner_cores }}
          RUNNER_LABEL: ${{ needs.resolve.outputs.runner_label }}
          RUNNER_MEMORY_GB: ${{ needs.resolve.outputs.runner_memory_gb }}
        run: |
          python3 trusted-workflow/jmh-ldbc/jmh-compare.py \
            --base /tmp/execution/base-results.json \
            --head /tmp/execution/head-results.json \
            --base-sha '${{ needs.resolve.outputs.baseline_sha }}' \
            --head-sha '${{ needs.resolve.outputs.head_sha }}' \
            --base-branch '${{ needs.resolve.outputs.base_sha }}' \
            --repo-url '${{ github.server_url }}/${{ github.repository }}' \
            --gremlin-arms '${{ needs.resolve.outputs.gremlin_arms }}' \
            --output /tmp/comparison-body.md
          {
            echo "## Requested benchmark runner"
            echo
            echo "- Profile: $RUNNER_CORES dedicated vCPUs, $RUNNER_MEMORY_GB GB memory"
            echo "- Resolved provider label: \`$RUNNER_LABEL\`"
            echo
            echo "This is the requested configuration, not physical hardware proof."
            echo
            cat /tmp/comparison-body.md
          } > /tmp/comparison.md
      - name: Upload complete validated results
        id: results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validated-comparison-attempt${{ github.run_attempt }}
          path: |
            /tmp/validation.json
            /tmp/comparison.md
            /tmp/execution/base-results.json
            /tmp/execution/head-results.json
          retention-days: 90
          if-no-files-found: error
      - name: Build exact completion JSON
        if: needs.resolve.outputs.full_pr == 'true'
        env:
          COMPLETED_AT: ${{ github.event.repository.updated_at }}
          RESULT_DIGEST: ${{ steps.results.outputs.artifact-digest }}
        run: |
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson pr_number '${{ needs.resolve.outputs.pr_number }}' \
            --arg executed_repository '${{ needs.resolve.outputs.head_repository }}' \
            --arg head_sha '${{ needs.resolve.outputs.head_sha }}' \
            --arg base_sha '${{ needs.resolve.outputs.base_sha }}' \
            --arg baseline_sha '${{ needs.resolve.outputs.baseline_sha }}' \
            --arg result_digest "sha256:$RESULT_DIGEST" \
            --arg validator_revision '${{ steps.signer.outputs.sha }}' \
            --arg completed_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{repository:$repository,pr_number:$pr_number,executed_repository:$executed_repository,
              head_sha:$head_sha,base_sha:$base_sha,baseline_sha:$baseline_sha,queries:"",
              gremlin_arms:"on",validation_contract:"ldbc-pr-completion-v3",
              result_digest:$result_digest,
              validator_workflow:"JetBrains/youtrackdb/.github/workflows/ldbc-jmh-compare.yml",
              validator_revision:$validator_revision,completed_at:$completed_at}' \
            > /tmp/completion-fields.json
          python3 trusted-workflow/.github/scripts/mandatory-benchmark.py completion \
            --fields /tmp/completion-fields.json --output /tmp/completion.json
      - name: Attest exact completion JSON
        if: needs.resolve.outputs.full_pr == 'true'
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: /tmp/completion.json
          show-summary: false
      - name: Build bounded signed completion comment
        if: needs.resolve.outputs.full_pr == 'true'
        run: |
          python3 trusted-workflow/.github/scripts/mandatory-benchmark.py comment \
            --completion /tmp/completion.json \
            --bundle '${{ steps.attest.outputs.bundle-path }}' \
            --output /tmp/completion-comment.md
      - name: Publish required signed completion
        if: needs.resolve.outputs.full_pr == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/completion-comment.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body,
            });
      - name: Publish informational performance report
        if: needs.resolve.outputs.target_mode == 'pr'
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/comparison.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: `<!-- jmh-ldbc-compare -->\n${report}`,
            });
